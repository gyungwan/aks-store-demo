# store-front를 공인 LB가 아니라 내부 LB(업무계 VNet 사설 IP)로 노출한다
# 원본은 type: LoadBalancer(공인)인데, UDR 클러스터에서 공인 LB를 쓰면 응답이 Firewall로 빠져
# 비대칭 라우팅이 생긴다 (§5-4). 점프 VM에서 사설 IP로 접속해 확인한다.
apiVersion: v1
kind: Service
metadata:
  name: store-front
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
