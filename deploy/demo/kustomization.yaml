# aks-store-demo (demo 환경) — Argo CD가 이 폴더를 배포한다1123
# 원본 매니페스트는 그대로 두고, 환경에 맞는 차이만 여기서 덮어쓴다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aks-store

resources:
  - aks-store-quickstart.yaml # Azure-Samples/aks-store-demo 원본 (v2.2.0)

patches:
  - path: store-front-internal-lb.yaml

# 모든 이미지를 우리 ACR에서 받는다 (Firewall은 ACR만 허용, §3-3)
# 앱 3개의 newTag는 CI(GitHub Actions)가 커밋 SHA로 바꿔 커밋한다
images:
  - name: rabbitmq
    newName: acrdemohubgwlee.azurecr.io/library/rabbitmq
  - name: busybox
    newName: acrdemohubgwlee.azurecr.io/library/busybox
  - name: ghcr.io/azure-samples/aks-store-demo/order-service
    newName: acrdemohubgwlee.azurecr.io/aks-store-demo/order-service
    newTag: "2.2.0"
  - name: ghcr.io/azure-samples/aks-store-demo/product-service
    newName: acrdemohubgwlee.azurecr.io/aks-store-demo/product-service
    newTag: "2.2.0"
  - name: ghcr.io/azure-samples/aks-store-demo/store-front
    newName: acrdemohubgwlee.azurecr.io/aks-store-demo/store-front
    newTag: "2.2.0"
